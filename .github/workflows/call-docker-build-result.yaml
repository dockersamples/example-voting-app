name: Call Docker Build and Push for Result Service Workflow

on:
  push:
    branches: main
    paths: 
      - "result/**" 
      - ".github/workflows/call-docker-build-result.yaml"

  pull_request:
    branches: main
    paths: 
      - "result/**" 
      - ".github/workflows/call-docker-build-result.yaml"
    

jobs:
  automated-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Automated Test
        run: |
          docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
        
  trivy-scan:
    runs-on: ubuntu-latest
    needs: automated-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./result"
          ignore-unfixed: true
          scanners: "misconfig,vuln"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: 1

