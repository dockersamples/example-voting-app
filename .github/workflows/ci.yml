name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute image name and tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/voting-app-${{ matrix.service }}" >> $GITHUB_ENV
          echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          load: true
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan ${{ matrix.service }} with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }}
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}