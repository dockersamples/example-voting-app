name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an older run on the same branch when you push again
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. TEST: run the full stack and prove a vote reaches Postgres
  # ---------------------------------------------------------------
  test:
    name: End-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Cast a vote
        run: |
          curl -sf -X POST -d "vote=a" http://localhost:8080/ -o /dev/null
          echo "Vote submitted"

      - name: Verify the vote reached Postgres
        run: |
          for i in $(seq 1 30); do
            count=$(docker compose exec -T db psql -U postgres -tAc "SELECT COUNT(*) FROM votes" 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "PASS: $count vote(s) stored in Postgres"
              exit 0
            fi
            echo "Waiting for worker... ($i/30)"
            sleep 2
          done
          echo "FAIL: vote never reached Postgres"
          exit 1

      - name: Verify the result page responds
        run: curl -sf http://localhost:8081/ -o /dev/null && echo "Result page OK"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # 2. BUILD -> SCAN -> PUSH, once per service, in parallel
  # ---------------------------------------------------------------
  build-scan-push:
    name: ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: ./vote
            target: final   # production stage (gunicorn), not the dev stage compose uses
          - service: result
            context: ./result
            target: ""
          - service: worker
            context: ./worker
            target: ""

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voting-app-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true    # keep it locally so Trivy can scan it
          push: false   # don't publish until the scan passes
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@TRIVY_SHA_HERE # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          echo "Pushed $IMAGE:${{ github.sha }}"