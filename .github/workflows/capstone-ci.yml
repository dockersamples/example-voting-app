name: Capstone CI

on:
  push:
    branches:
      - main
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-build-scan:
    name: Validate, test, build and scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start app and smoke-test HTTP endpoints
        run: |
          docker compose up -d --build

          for _attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null &&
               curl -fsS http://localhost:8081/ >/dev/null; then
              echo "Vote and result HTTP checks passed."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop development containers
        if: always()
        run: docker compose down -v

      - name: Build production images
        id: build-images
        run: |
          docker build --target final -t voting-app-vote:ci ./vote
          docker build -t voting-app-result:ci ./result
          docker build -t voting-app-worker:ci ./worker

      - name: Scan vote image with Trivy
        if: always() && steps.build-images.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-vote:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivy-args: --skip-files "**/pip/_vendor/bom.cdx.json"

      - name: Scan result image with Trivy
        if: always() && steps.build-images.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-result:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan worker image with Trivy
        if: always() && steps.build-images.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-worker:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish:
    name: Publish images to GHCR
    needs: validate-build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          file: ./vote/Dockerfile
          target: final
          push: true
          tags: ghcr.io/dalauren12345/voting-app-vote:${{ github.sha }}

      - name: Publish result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          file: ./result/Dockerfile
          push: true
          tags: ghcr.io/dalauren12345/voting-app-result:${{ github.sha }}

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ghcr.io/dalauren12345/voting-app-worker:${{ github.sha }}
