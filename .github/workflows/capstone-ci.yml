name: Capstone CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/container-hardening

permissions:
  contents: read
  packages: write

jobs:
  test-scan-publish:
    name: Test, scan, and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set image names and SHA tag
        id: meta
        shell: bash
        run: |
          echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build vote image
        run: docker build -t vote:test ./vote

      - name: Verify Python packages in vote image
        run: |
          docker run --rm --entrypoint python vote:test \
            -m pip show wheel jaraco.context

      - name: Build result image
        run: docker build -t result:test ./result

      - name: Build worker image
        run: docker build -t worker:test ./worker

      - name: Scan vote image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: vote:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan result image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: result:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: worker:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images for GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ steps.meta.outputs.owner }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker tag vote:test "$REGISTRY/$OWNER/example-voting-app-vote:$SHA_TAG"
          docker tag result:test "$REGISTRY/$OWNER/example-voting-app-result:$SHA_TAG"
          docker tag worker:test "$REGISTRY/$OWNER/example-voting-app-worker:$SHA_TAG"

      - name: Push images to GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ steps.meta.outputs.owner }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker push "$REGISTRY/$OWNER/example-voting-app-vote:$SHA_TAG"
          docker push "$REGISTRY/$OWNER/example-voting-app-result:$SHA_TAG"
          docker push "$REGISTRY/$OWNER/example-voting-app-worker:$SHA_TAG"
