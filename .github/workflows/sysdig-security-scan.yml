name: Sysdig Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - vote
          - result
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --pull -t sysdig-assessment-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Scan image with Sysdig Secure
        uses: sysdiglabs/scan-action@v6
        with:
          image-tag: sysdig-assessment-${{ matrix.service }}:${{ github.sha }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: https://app.us4.sysdig.com
          stop-on-processing-error: true
          stop-on-failed-policy-eval: false
