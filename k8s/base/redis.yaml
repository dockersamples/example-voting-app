apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # AOF: a crash loses at most ~1s of queued votes (see docs/gamedays/001)
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          env:
            - {name: REDIS_ADDR, value: "redis://localhost:6379"}
            - {name: REDIS_EXPORTER_CHECK_SINGLE_KEYS, value: "db0=votes"}
          ports:
            - {name: metrics, containerPort: 9121}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
    - {name: metrics, port: 9121, targetPort: metrics}
