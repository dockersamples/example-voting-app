apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # Safe to run >1: votes are claimed atomically with LMOVE and writes are
  # idempotent upserts (see worker/Program.cs).
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: voting-app/worker
          env:
            - {name: REDIS_HOST, value: redis}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_CONNECTION_STRING}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
