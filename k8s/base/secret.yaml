# Demo credentials only. In a real cluster use External Secrets / Sealed
# Secrets / AWS Secrets Manager instead of committing a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DB_CONNECTION_STRING: "Server=db;Username=postgres;Password=postgres;"
