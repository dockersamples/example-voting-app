name: voting-app

services:
  vote:
    build: ./vote
    ports:
      - "8080:8080"
    environment:
      OPTION_A: Cats
      OPTION_B: Dogs
    depends_on:
      redis:
        condition: service_healthy
    networks: [front-tier, back-tier]

  result:
    build: ./result
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [front-tier, back-tier]

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks: [back-tier]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back-tier]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      # The sample app code hard-codes this value (see Step 2b). Never reuse it anywhere real.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back-tier]

networks:
  front-tier:
  back-tier:

volumes:
  db-data:
