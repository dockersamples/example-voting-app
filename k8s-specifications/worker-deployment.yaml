apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: 185529490184.dkr.ecr.eu-west-1.amazonaws.com/assets-liabilities-worker:latest
        name: worker
