apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: 185529490184.dkr.ecr.eu-west-1.amazonaws.com/assets-liabilities-vote:latest
        name: vote
        ports:
        - containerPort: 8080
          name: vote
