apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        # Build locally: docker build -t aca-voting-app-vote:latest ./vote
        image: aca-voting-app-vote:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: vote
        envFrom:
        - configMapRef:
            name: voting-app-config
        - secretRef:
            name: voting-app-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
