apiVersion: v1
kind: Secret
metadata:
  name: voting-db
  labels:
    {{- include "voting.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ required "db.password is required: pass --set-string db.password=..." .Values.db.password | quote }}
