apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-result
spec:
  replicas: {{ .Values.replicas.result }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-result
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-result
    spec:
      containers:
        - name: result
          image: {{ .Values.images.result }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "80"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: result
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-result
  ports:
    - name: http
      port: 8081
      targetPort: 80
