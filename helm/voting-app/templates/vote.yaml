apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vote
spec:
  replicas: {{ .Values.replicas.vote }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vote
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vote
    spec:
      containers:
        - name: vote
          image: {{ .Values.images.vote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: OPTION_A
              value: "NDC / Peter Obi"
            - name: OPTION_B
              value: "ADC / Atiku"
            - name: OPTION_C
              value: "APC / Tinubu"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vote
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-vote
  ports:
    - name: http
      port: 8080
      targetPort: 80
