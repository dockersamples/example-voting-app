# ---- Images built by CI (Phase 4), all tagged with the same commit SHA ----
image:
  registry: ghcr.io/akpochi
  tag: "2281e1fce2b444a89bbff415178af02b343c2eeb"
  pullPolicy: IfNotPresent

vote:
  replicas: 2
  service:
    type: ClusterIP   # change to LoadBalancer for a public AWS URL
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

result:
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# ---- Third-party images, pinned by digest (same as Phase 2 compose) ----
redis:
  image: redis:alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

db:
  image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
  # Must match the connection strings hard-coded in result/server.js and worker/Program.cs
  user: postgres
  password: postgres
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
